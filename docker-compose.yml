services:
  db:
    image: postgres:16
    container_name: brewlite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - brewlite-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    init: true
    env_file: ./backend/.env
    environment: &backend-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brewlite}?schema=public
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/products',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    init: true
    environment:
      SERVER_API_URL: http://backend:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    profiles: ["setup"]
    build:
      context: ./backend
      target: tools
    env_file: ./backend/.env
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  seed:
    profiles: ["setup"]
    build:
      context: ./backend
      target: tools
    env_file: ./backend/.env
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "db", "seed"]

volumes:
  brewlite-data:
